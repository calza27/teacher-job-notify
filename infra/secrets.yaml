AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  teacher-job-notify secrets. CloudFormation creates the secret with a
  placeholder value; set the real values by hand so they never live in git.

Parameters:
  SecretName:
    Type: String
    Default: teacher-job-notify

Resources:
  NotifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref SecretName
      Description: >-
        teacher-job-notify settings. JSON: {"notify_email": "<address to send job alerts to>"}.
        Set by hand; deploy.sh prompts for it while the placeholder is present.
      # Placeholder only. Never change this property: CloudFormation would
      # overwrite the value set by hand.
      SecretString: '{"notify_email":"REPLACE_ME"}'

Outputs:
  SecretArn:
    Value: !Ref NotifySecret
